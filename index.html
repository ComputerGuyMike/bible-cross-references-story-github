<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow a story through the Bible</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0e12; --panel: #14151b; --panel2: #1a1c24; --line: #2a2d38; --line2: #3a3e4d;
    --text: #e8e9ee; --dim: #a3a7b5; --faint: #6f7385; --accent: #6ea8ff;
    --quote: #2fbf94; --parallel: #4a9bf0; --xref: #9a98a0; --event: #d9962b; --person: #9a8cf5; --place: #7fc23e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100vh; }
  /* ---------- rail ---------- */
  .rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 30px; }
  .rail h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .rail .sub { color: var(--faint); font-size: 12px; margin: 0 0 12px; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 11px; font-size: 12.5px; }
  .btn:hover { background: #242735; }
  .btn.primary { background: #25437a; border-color: #3b64ab; }
  .btn.primary:hover { background: #2d518f; }
  .sect { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 16px 0 6px; }
  .step { position: relative; padding: 5px 6px 5px 22px; border-radius: 6px; cursor: pointer; color: var(--dim); line-height: 1.3; }
  .step:hover { background: var(--panel2); }
  .step::before { content: ""; position: absolute; left: 7px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
  .step::after { content: ""; position: absolute; left: 10.5px; top: 21px; bottom: -8px; width: 1px; background: var(--line2); }
  .step.lastp::after { display: none; }
  .step.now { color: var(--text); font-weight: 600; background: #1d2740; }
  .step.now::before { background: var(--accent); box-shadow: 0 0 0 3px #26407a; }
  .step small { display: block; font-weight: 400; font-size: 11.5px; color: var(--faint); }
  .branch { margin: 1px 0 3px 22px; padding: 4px 8px; border: 1px dashed var(--line2); border-radius: 6px; font-size: 12px; color: var(--faint); cursor: pointer; line-height: 1.3; }
  .branch:hover { color: var(--text); border-color: var(--accent); }
  .branch.cont { border-color: #3b64ab; color: var(--dim); }
  .journey { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .journey:hover { background: var(--panel2); }
  .journey.on { border-color: var(--accent); }
  .journey b { font-weight: 600; display: block; font-size: 13px; }
  .journey small { color: var(--faint); font-size: 11.5px; }
  .journey .acts { float: right; display: flex; gap: 4px; }
  .journey .acts button { background: none; border: none; color: var(--faint); font-size: 13px; padding: 0 3px; }
  .journey .acts button:hover { color: var(--text); }
  .journey .acts .on { color: #f2c14e; }
  .search { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; color: var(--text); padding: 6px 9px; font: inherit; }
  /* ---------- main ---------- */
  .main { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 14px 22px 40px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
  .chip { background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); border-radius: 14px; padding: 3px 11px; font-size: 12.5px; }
  .chip:hover { color: var(--text); }
  .chip.on { background: #25437a; border-color: #3b64ab; color: #fff; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  select.chip { padding: 3px 8px; }
  .follow { background: #2a2350; border-color: #5a4fb0; color: #d9d3ff; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
  .card h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .card .meta { color: var(--faint); font-size: 12.5px; margin: 2px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .evchip { border: 1px solid var(--event); color: var(--event); border-radius: 10px; padding: 0 8px; font-size: 12px; background: none; }
  .evchip:hover, .evchip.on { background: var(--event); color: #1a1200; }
  .ptext { font-family: Georgia, "Times New Roman", serif; font-size: 16.5px; line-height: 1.7; max-height: 230px; overflow-y: auto; padding-right: 8px; }
  .ptext sup { color: var(--faint); font-family: -apple-system, sans-serif; font-size: 10.5px; margin-right: 2px; }
  .ent { cursor: pointer; border-bottom: 1.5px solid; }
  .ent.p { border-color: var(--person); }
  .ent.l { border-color: var(--place); }
  .ent:hover, .ent.sel { background: #262a3b; }
  .pop { margin-top: 12px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px; }
  .pop h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .pop h3 span { font-weight: 400; font-size: 12px; color: var(--dim); margin-left: 6px; }
  .pop p { margin: 6px 0; color: var(--dim); font-size: 13px; }
  .pop .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--faint); }
  .pill { background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; padding: 1px 9px; font-size: 12px; color: var(--dim); }
  .pill:hover { color: var(--text); border-color: var(--accent); }
  .pill.p { border-color: #4b4491; } .pill.l { border-color: #50772a; }
  .warn { color: #e0a64a; font-size: 12.5px; }
  /* ---------- flowchart ---------- */
  .flowhead { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 8px; }
  .flowhead b { font-weight: 600; }
  .flowhead span { color: var(--faint); font-size: 12.5px; }
  .flow { position: relative; display: grid; grid-template-columns: 170px minmax(0, 1.3fr) minmax(0, .9fr); column-gap: 48px; row-gap: 10px; align-items: stretch; }
  .flow svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .curnode { grid-column: 1; grid-row: 1 / span 12; align-self: center; background: #1d2740; border: 1.5px solid #3b64ab; border-radius: 10px; padding: 10px 12px; position: relative; z-index: 1; }
  .curnode b { display: block; font-size: 14px; }
  .curnode small { color: var(--dim); font-size: 12px; }
  .opt { grid-column: 2; background: var(--panel); border: 1px solid var(--line2); border-left: 4px solid var(--c, var(--xref)); border-radius: 9px; padding: 7px 11px 8px; cursor: pointer; text-align: left; position: relative; z-index: 1; min-width: 0; }
  .opt:hover { background: var(--panel2); border-color: var(--c); }
  .opt b { display: block; font-size: 13.5px; font-weight: 600; }
  .opt .why { font-size: 12px; color: var(--c, var(--dim)); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .opt .why i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .opt .snip { font-size: 12px; color: var(--faint); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .stub { grid-column: 3; align-self: center; display: flex; flex-direction: column; gap: 3px; opacity: .72; min-width: 0; position: relative; z-index: 1; }
  .stub:hover { opacity: 1; }
  .stub button { text-align: left; background: none; border: 1px dashed var(--line2); border-radius: 7px; padding: 2px 8px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stub button:hover { border-color: var(--accent); color: var(--text); }
  .stub span { font-size: 11.5px; color: var(--faint); padding-left: 4px; }
  .empty { color: var(--dim); padding: 22px; border: 1px dashed var(--line2); border-radius: 10px; grid-column: 2 / span 2; }
  .more { margin-top: 10px; }
  .foot { color: var(--faint); font-size: 11.5px; margin-top: 28px; line-height: 1.5; }
  .foot a { color: var(--dim); }
  /* ---------- picker ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding-top: 9vh; z-index: 20; }
  .overlay.open { display: flex; }
  .picker { width: min(640px, 92vw); max-height: 78vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 16px 18px 18px; }
  .picker h2 { margin: 0 0 4px; font-size: 17px; }
  .picker input { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 9px 12px; color: var(--text); font: inherit; font-size: 15px; margin: 8px 0 6px; }
  .picker textarea { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 9px 12px; color: var(--text); font: 12.5px/1.4 ui-monospace, Menlo, monospace; margin: 10px 0 4px; resize: vertical; }
  .pgroup { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 12px 0 4px; }
  .pitem { display: flex; justify-content: space-between; gap: 10px; width: 100%; background: none; border: none; text-align: left; padding: 6px 8px; border-radius: 7px; color: var(--text); }
  .pitem:hover { background: var(--panel2); }
  .pitem small { color: var(--faint); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--faint); margin: 2px 0 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  /* ---------- notes, nav ---------- */
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel2); border: none; border-right: 1px solid var(--line2); padding: 5px 14px; font-size: 12.5px; color: var(--dim); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: #25437a; color: #fff; }
  .notebox { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .notebox summary { cursor: pointer; color: var(--accent); }
  .notebox textarea, .jd textarea, .jd input.title { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; margin-top: 6px; resize: vertical; }
  /* ---------- journeys view ---------- */
  .jhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .jhead h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .tools input[type=search], .tools select { background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; color: var(--text); padding: 5px 9px; font: inherit; }
  .tools input[type=search] { min-width: 220px; }
  .tagchip { background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); border-radius: 12px; padding: 1px 10px; font-size: 12px; }
  .tagchip.on { background: #25437a; border-color: #3b64ab; color: #fff; }
  .tagchip small { color: var(--faint); margin-left: 4px; }
  .jgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .jcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .jcard:hover { border-color: var(--line2); background: var(--panel2); }
  .jcard.cur { border-color: var(--accent); }
  .jcard h3 { margin: 0; font-size: 14.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .jcard .star, .star { background: none; border: none; color: var(--faint); font-size: 16px; padding: 0; line-height: 1; }
  .star.on { color: #f2c14e; }
  .jcard .meta, .meta2 { color: var(--faint); font-size: 12px; }
  .jcard .desc { color: var(--dim); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { background: #1f2740; border: 1px solid #34406a; color: #b9c6f2; border-radius: 10px; padding: 0 8px; font-size: 11.5px; }
  .tag button { background: none; border: none; color: inherit; padding: 0 0 0 4px; font-size: 11px; }
  .jd .crumb { background: none; border: none; color: var(--accent); padding: 0; margin-bottom: 8px; }
  .jd .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .jd input.title { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .jd select { background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; color: var(--text); padding: 5px 8px; font: inherit; }
  .jd .tagadd { background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); padding: 2px 10px; font: inherit; font-size: 12px; width: 130px; }
  .btn.danger:hover { background: #4a2024; border-color: #8a3a42; }
  .vbody { margin-top: 12px; }
  .treewrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px; max-height: 560px; }
  .treewrap text { fill: var(--text); font-size: 12px; }
  .nodepanel { margin-top: 12px; }
  .stagewrap { position: relative; border: 1px solid var(--line); border-radius: 12px; background: #0a0b0f; overflow: hidden; }
  .stagewrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .stagewrap svg { position: relative; display: block; width: 100%; height: auto; }
  .stagewrap svg text { fill: var(--text); font-size: 11.5px; }
  .caption { color: var(--faint); font-size: 12.5px; margin: 6px 2px; }
  .libcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .libcard h3 { margin: 0 0 3px; font-size: 15.5px; }
  .libcard p { margin: 4px 0 8px; color: var(--dim); font-size: 13.5px; }
  .libsteps { margin: 8px 0 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  .libsteps li { margin-bottom: 4px; } .libsteps small { color: var(--faint); display: block; }
  .guide { background: #f6f3ea; color: #1b1b1b; border-radius: 12px; padding: 24px 30px; font-family: Georgia, "Times New Roman", serif; line-height: 1.6; }
  .guide h1 { font-size: 24px; margin: 0 0 4px; } .guide h2 { font-size: 17px; margin: 22px 0 2px; border-top: 1px solid #cfc9b8; padding-top: 12px; }
  .guide .via, .guide .ents { font: 12.5px/1.4 -apple-system, sans-serif; color: #5a5648; }
  .guide .gtext { margin: 6px 0; } .guide .gtext sup { font: 10px sans-serif; color: #7a7566; margin-right: 2px; }
  .guide .gnote { background: #ece6d2; border-left: 3px solid #b8a45a; padding: 6px 10px; margin: 6px 0; font-size: 14px; }
  .guide .gbranch { font: italic 12.5px sans-serif; color: #7a5a2a; }
  .opts label { margin-right: 14px; font-size: 13px; color: var(--dim); }
  .timeline-undated { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .pillx { display: inline-block; background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; padding: 0 9px; margin: 2px 4px 2px 0; font-size: 12px; color: var(--dim); }
  .backup .card p { color: var(--dim); }
  @media print {
    html, body { background: #fff !important; color: #000 !important; height: auto; }
    .rail, .jhead, .tools, .jd .crumb, .jd .row, .noprint, .overlay { display: none !important; }
    .app { display: block; height: auto; } .main { overflow: visible; padding: 0; }
    .guide { background: #fff; padding: 0; border-radius: 0; } .guide h2 { page-break-after: avoid; } .guide .gstep { page-break-inside: avoid; }
  }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; height: auto; } .rail { max-height: 46vh; } .flow { grid-template-columns: 130px 1fr; } .stub { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main" id="main"></main>
</div>
<div class="overlay" id="overlay"><div class="picker" id="picker"></div></div>
<script src="data.js"></script>
<script src="land.js"></script>
<script src="app.js"></script>
<script src="journeys.js"></script>
</body>
</html>
